function dupPopup(f,onUse,onNew){
  var c=f.c,k=ccalc(c),dg=document.getElementById("dlg2"),nameOnly=f.how==="name";
  if(!dg){dg=document.createElement("dialog");dg.id="dlg2";document.body.appendChild(dg)}
  dg.innerHTML='<h3 style="margin:0;color:var(--red)">'+(nameOnly?'A customer with this name is already saved':'This customer is already saved')+'</h3><p style="margin:10px 0 4px;font-size:18px"><b>'+esc(c.name)+'</b></p><div class="meta2" style="font-size:15px">Saved mobile: <b>'+esc(c.phone||"-")+'</b>'+(c.address?' · '+esc(c.address):'')+'</div><div class="meta2">Matched by: '+f.how+'</div>'+
   (nameOnly?'<div style="color:var(--red);margin-top:6px;font-size:14px">Ask the customer: is '+esc(c.phone||"this")+' your number? If yes, use this customer. If it is a different person, save as new.</div>':'<div style="margin-top:6px;font-size:14px">Confirm with the customer that this is their number.</div>')+
   '<div style="margin-top:10px">'+(k.bal>0?'<span class="tg o">Balance to receive '+money(k.bal)+'</span>':k.bal<0?'<span class="tg g">Advance '+money(-k.bal)+'</span>':'<span class="tg g">Nothing pending, all settled</span>')+(k.od>0?' <span class="tg r">Overdue '+money(k.od)+'</span>':'')+'</div>'+
   '<div class="acts" style="flex-wrap:wrap">'+(onUse?'<button class="p" id="dupu">Use this customer for the bill</button>':'')+'<button '+(onUse?'':'class="p" ')+'id="dupo">Full statement (khata)</button>'+(onNew?'<button id="dupn">Different person, save as new</button>':'')+'<button id="dupx">OK</button></div>';
  dg.showModal();
  document.getElementById("dupx").onclick=function(){dg.close()};
  document.getElementById("dupo").onclick=function(){dg.close();dlg.close();tab="cust";ccur=c.id;render();window.scrollTo(0,0)};
  if(onUse)document.getElementById("dupu").onclick=function(){dg.close();onUse()};
  if(onNew)document.getElementById("dupn").onclick=function(){dg.close();onNew()}}
function custForm(c){
  var e=c||{name:"",phone:"",address:"",days:30,gstin:"",state:""};
  open('<h3 style="margin:0">'+(c?"Edit customer":"Add customer")+'</h3><label>Customer name *<input id="u1" value="'+esc(e.name)+'"></label><label>Mobile number (WhatsApp) *<input id="u2" type="tel" inputmode="tel" value="'+esc(e.phone)+'"></label><label>Address<input id="u3" value="'+esc(e.address||"")+'"></label>'+
   '<label>Customer GST number (optional)<input id="u5" maxlength="15" style="text-transform:uppercase" value="'+esc(e.gstin||"")+'"></label><label>State<select id="u6">'+stOpts(e.state||gstState(e.gstin))+'</select></label>'+
   '<label>Credit period (days to pay)<input id="u4" type="number" min="0" value="'+e.days+'"></label><div class="ge" id="ge"></div><div class="acts"><button class="p" id="ok">Save</button><button id="cx">Cancel</button></div>');
  document.getElementById("u5").oninput=function(){var g=this.value.trim().toUpperCase(),st=gstState(g);if(GSTRE.test(g)&&st)document.getElementById("u6").value=st};
  function chkDup(force){var f=findDupCust(document.getElementById("u1").value,document.getElementById("u2").value,c?c.id:null);
    if(!f){dupShown="";return false}
    var key=f.c.id+"|"+f.how;if(!force&&dupShown===key)return true;dupShown=key;dupPopup(f);return true}
  document.getElementById("u1").onchange=function(){chkDup(false)};
  document.getElementById("u2").oninput=function(){if(this.value.replace(/\D/g,"").length>=10)chkDup(false)};
  document.getElementById("u2").onchange=function(){chkDup(false)};
  document.getElementById("ok").onclick=function(){
    var n=fv("u1"),ph=fv("u2"),g=fv("u5").toUpperCase(),er=document.getElementById("ge");
    if(!n){er.textContent="Enter the customer name.";return}
    if(ph.replace(/\D/g,"").length<10){er.textContent="Enter a mobile number with at least 10 digits.";return}
    if(g&&!GSTRE.test(g)){er.textContent="GST number should be 15 characters, like 09ABCDE1234F1Z5.";return}
    var dup=findDupCust(n,ph,c?c.id:null);
    if(dup&&!(dup.how==="name"&&dupOK===dup.c.id)){er.textContent="This customer is already saved: "+dup.c.name+".";dupShown="";dupPopup(dup,null,dup.how==="name"?function(){dupOK=dup.c.id;document.getElementById("ok").onclick()}:null);return}
    var o={name:n,phone:ph,address:fv("u3"),gstin:g,state:fv("u6")||gstState(g),days:Math.max(0,+fv("u4")||0)};
    if(c)Object.assign(c,o);else S.custs.push(Object.assign({id:uid(),bl:false,blr:"",lastRem:""},o));
    save();render();dlg.close()}}

   '<label>Total amount returned incl. GST (₹)<input id="n1" type="number" inputmode="decimal" min="1"></label><label>Of which GST (₹, optional)<input id="n2" type="number" inputmode="decimal" min="0" value="0"></label>'+

    if(pid&&q>0){var it=S.itms.filter(function(x){return x.id===pid})[0];if(it){it.stock=r2((+it.stock||0)+q);o.rstk=[{pid:pid,q:q}]}}

function billLines(t){return(t.items&&t.items.length)?t.items:[{d:t.note||"Goods supplied",hsn:"",q:1,u:"",r:t.amt,disc:0,gst:0}]}
function billCalc(t){var has=t.items&&t.items.length,cal=gstCalc(billLines(t),!!t.inter,t.mode==="tax");if(!has){cal.ro=0;cal.grand=t.amt;cal.total=t.amt}return cal}
function upiLink(a,note){return"upi://pay?pa="+encodeURIComponent(BIZ.upi)+"&pn="+encodeURIComponent(BIZ.holder||BIZ.name||"")+"&am="+a.toFixed(2)+"&cu=INR&tn="+encodeURIComponent(note||"Bill payment")}
function invInfo(t,c,cb){
  var rem=null;try{var r=ccalc(c).rows.filter(function(x){return x.t.id===t.id})[0];if(r)rem=r.rem}catch(e){}
  if(rem!=null&&rem>0&&BIZ&&BIZ.upi){ensureQr(function(ok){var qr="";if(ok){try{qr=qrCanvas(upiLink(rem,"Bill "+(t.bill||"")),300).toDataURL("image/png")}catch(e){}}cb(qr,rem)})}
  else cb("",rem)}
function billBody(t,c,qr,rem){
  var b=BIZ||{},tax=t.mode==="tax",it=billLines(t),cal=billCalc(t),inter=!!t.inter,n=function(x){return'<td class="n">'+money2(x)+'</td>'};
  var rows=it.map(function(x,i){var L=cal.L[i];
    return'<tr><td>'+(i+1)+'</td><td>'+esc(x.d||"Item")+'</td>'+(tax?'<td>'+(x.hsn?esc(x.hsn):"-")+'</td>':'')+'<td class="n">'+x.q+'</td><td>'+esc(x.u||"")+'</td>'+n(x.r)+'<td class="n">'+(x.disc||0)+'</td>'+n(L.tv)+(tax?'<td class="n">'+L.rt+'%</td>'+n(L.tx)+n(L.tv+L.tx):'')+'</tr>'}).join("");
  var th='<tr><th>#</th><th>Particulars</th>'+(tax?'<th>HSN</th>':'')+'<th>Qty</th><th>Unit</th><th>Rate</th><th>Disc %</th><th>Taxable</th>'+(tax?'<th>GST %</th><th>Tax</th><th>Amount</th>':'')+'</tr>';

  var x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,w);x.fillStyle="#000";
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+m)*cell,(r+m)*cell,cell,cell);
  return cv}

   '<div class="ge" id="ge"></div><div class="acts" style="flex-wrap:wrap"><button class="p" id="ok">Save</button><button id="wcx">Remove details</button><button id="cx">Cancel</button></div>');
  gid("ok").onclick=function(){
    var o={pid:fv("wc1").replace(/\D/g,""),token:fv("wc2"),auto:gid("wc3").checked,billTmpl:fv("wc4"),svcTmpl:fv("wc5"),lang:fv("wc6")||"en"};
    if(!o.pid||!o.token){gid("ge").textContent="Enter both the phone number ID and the access token, or use Remove details.";return}
    try{localStorage.setItem(KEY+"-wacfg",JSON.stringify(o))}catch(e){}
    dlg.close();toast("WhatsApp auto-send saved.")};
  gid("wcx").onclick=function(){try{localStorage.removeItem(KEY+"-wacfg")}catch(e){}dlg.close();toast("WhatsApp auto-send details removed.")}}

/* ================= Services: items given for repair/service, with a "ready" message on WhatsApp ================= */
var SVV={q:"",st:""},SVST=[["received","Received","o"],["progress","In progress","d"],["done","Ready for pickup","g"],["delivered","Delivered","g"]];
function svcList(){return S.svc=S.svc||[]}
function svcSt(s){return SVST.filter(function(a){return a[0]===s})[0]||SVST[0]}
function svcCust(j){return S.custs.filter(function(c){return c.id===j.cid})[0]}
function svcBal(j){return Math.max(0,r2((+j.charge||0)-(+j.adv||0)))}
function svcNo(){var n=0;svcList().forEach(function(j){var m=/^SV-(\d+)$/.exec(j.no||"");if(m)n=Math.max(n,+m[1])});return"SV-"+(n+1)}
function svcText(j,c){
  var ch=+j.charge||0,ad=+j.adv||0;
  return"Hello "+c.name+", good news! Your "+j.item+" service at "+bizn()+" is complete and ready for pickup."+(ch>0?" Service charge: Rs. "+money2(ch)+(ad>0?", advance paid: Rs. "+money2(ad)+", balance to pay: Rs. "+money2(svcBal(j))+".":"."):"")+" Thank you. - "+bizn()+(revUrl()?"\n\n"+REVTXT+"\n"+revUrl():"")}
function svcView(){
  var on=tab==="svc",el=gid("svhome");if(!el)return;el.hidden=!on;gid("tSvc").className=on?"p":"";
  if(!on)return;
  if(!el.dataset.b){el.dataset.b="1";
    el.innerHTML='<div class="big"><button class="p" data-svnew="1">+ New service job</button></div><div id="svsum"></div><input id="svq" type="search" placeholder="Search by customer, mobile, item, job no or note" aria-label="Search services" style="margin:0 0 12px"><div id="svst" class="big" style="margin-bottom:12px"></div><div id="svbody"></div>';
    gid("svq").oninput=function(){SVV.q=this.value;svcBody()}}
  svcBody()}
function svcBody(){
  var L=svcList(),q=SVV.q.trim().toLowerCase(),n={};L.forEach(function(j){n[j.status]=(n[j.status]||0)+1});
  gid("svsum").innerHTML='<div class="cards"><div class="card"><span>Received / in progress</span><b>'+((n.received||0)+(n.progress||0))+'</b></div><div class="card paid"><span>Ready for pickup</span><b>'+(n.done||0)+'</b></div><div class="card"><span>Delivered</span><b>'+(n.delivered||0)+'</b></div></div>';
  gid("svst").innerHTML='<button class="'+(SVV.st?"":"p")+'" data-svfil="">All ('+L.length+')</button>'+SVST.map(function(s){return'<button class="'+(SVV.st===s[0]?"p":"")+'" data-svfil="'+s[0]+'">'+s[1]+' ('+(n[s[0]]||0)+')</button>'}).join("");
  var F2=L.filter(function(j){
    if(SVV.st&&j.status!==SVV.st)return false;
    if(!q)return true;
    var c=svcCust(j)||{},hay=[j.no,j.item,j.work,j.note,c.name,c.phone,fdate(j.recv)].join(" ").toLowerCase();
    return q.split(/\s+/).every(function(w){return hay.indexOf(w)>-1})}).sort(function(a,b){
      var o={received:0,progress:1,done:2,delivered:3};return(o[a.status]-o[b.status])||(a.recv<b.recv?1:a.recv>b.recv?-1:0)});
  gid("svbody").innerHTML=F2.length?F2.map(function(j){
    var c=svcCust(j),st=svcSt(j.status),ch=+j.charge||0,info=[];
    if(j.work)info.push("Work: "+esc(j.work));
    if(ch>0)info.push("Charge "+money(ch)+(+j.adv>0?" · advance "+money(+j.adv)+" · balance "+money(svcBal(j)):""));
    if(j.note)info.push("Note: "+esc(j.note));
    var bt="";
    if(j.status==="received")bt+='<button data-svgo="'+j.id+'">Start work</button>';
    if(j.status==="received"||j.status==="progress")bt+='<button class="p" data-svdone="'+j.id+'">Mark complete &amp; send WhatsApp</button>';
    if(j.status==="done")bt+='<button class="p" data-svmsg="'+j.id+'">Send WhatsApp message</button><button data-svdlv="'+j.id+'">Mark delivered</button>';
    return'<div class="sup" style="display:block"><div class="rw"><div><b>'+esc(j.no||"")+' · '+esc(j.item)+'</b> <span class="tg '+st[2]+'">'+st[1]+'</span>'+(j.msgAt?' <span class="tg g">WhatsApp sent '+fT(j.msgAt)+'</span>':'')+'<small>'+esc(c?c.name:"(deleted customer)")+(c&&c.phone?' · '+esc(c.phone):'')+' · received '+fdate(j.recv)+'</small></div></div>'+(info.length?'<div class="meta2" style="margin-top:6px">'+info.join("<br>")+'</div>':'')+
      '<div class="pa">'+bt+'<button data-svedit="'+j.id+'">Edit</button><button class="dl" data-svrm="'+j.id+'">Delete</button></div></div>'}).join(""):'<div class="empty">'+(L.length?"No job matches.":"No service jobs yet. When a customer gives an item for service, add it here. When the work is done, one tap sends the 'ready' message on WhatsApp.")+'</div>'}
function svcClick(e){
  function g(a){var q=e.target.closest("[data-"+a+"]");return q?q.dataset[a]:null}
  var v,j=function(i){return svcList().filter(function(x){return x.id===i})[0]};
  if(g("svnew")){svcForm();return}
  if((v=g("svfil"))!==null){SVV.st=v;svcBody();return}
  if((v=g("svedit"))){var a=j(v);if(a)svcForm(a);return}
  if((v=g("svgo"))){var b=j(v);if(b){b.status="progress";save();render()}return}
  if((v=g("svdone"))){var d=j(v);if(d){d.status="done";d.doneAt=Date.now();save();render();svcMsgDlg(d,true)}return}
  if((v=g("svmsg"))){var m=j(v);if(m)svcMsgDlg(m,false);return}
  if((v=g("svdlv"))){var y=j(v);if(y){y.status="delivered";y.dlvAt=Date.now();save();render();toast("Marked as delivered.")}return}
  if((v=g("svrm"))){var x=j(v);if(x)confirmDlg("Delete "+esc(x.no||"this job")+"?","This service job is removed from the list. This cannot be undone.","Delete",function(){S.svc=svcList().filter(function(z){return z.id!==v});save();render()})}}
function svcMsgDlg(j,auto){
  var c=svcCust(j);if(!c)return;
  var api=waApiOn(),g=waCfg(),txt=svcText(j,c),ph=wn(c.phone),ok=validWa(ph);
  open('<h3 style="margin:0">'+(auto?"Marked complete: ":"Message for ")+esc(j.item)+'</h3><div class="meta2">Customer: <b>'+esc(c.name)+'</b> · '+esc(c.phone||"no number saved")+'</div>'+
   (ok?'':'<div class="ge" style="margin-top:8px">No valid mobile number is saved for this customer, so WhatsApp cannot open. Add the number in Customers, then send again.</div>')+
   '<label>Message (you can edit it)<textarea id="svt" rows="6">'+esc(txt)+'</textarea></label>'+
   '<div class="acts" style="flex-direction:column;align-items:stretch">'+
   (api&&ok?'<button class="p" id="svapi" style="background:#128c7e;border-color:#128c7e;color:#fff;font-weight:600;padding:14px">Send automatically on WhatsApp</button>':'')+
   (ok?'<a class="ab'+(api?' o':'')+'" id="svwa" target="_blank" rel="noopener" style="text-align:center;padding:14px" href="https://wa.me/'+ph+'?text='+encodeURIComponent(txt)+'">Open WhatsApp chat with '+esc(c.name)+'</a>':'')+
   '<button id="cx">Close</button></div><div class="dm" id="dm"></div>');
  var ta=gid("svt");
  ta.oninput=function(){var l=gid("svwa");if(l)l.href="https://wa.me/"+ph+"?text="+encodeURIComponent(ta.value)};
  if(gid("svwa"))gid("svwa").onclick=function(){j.msgAt=Date.now();save();setTimeout(render,300)};
  function go(){
    var b=gid("svapi"),m=gid("dm");if(!b)return;b.disabled=true;m.style.color="";m.textContent="Sending to "+c.name+" on WhatsApp...";
    waApiSendText(ph,ta.value,g.svcTmpl,[c.name,j.item,money2(svcBal(j)),revUrl()||bizn()]).then(function(){j.msgAt=Date.now();save();render();m.style.color="var(--ok)";m.textContent="Sent. "+c.name+" has got the message on WhatsApp.";b.disabled=false}).catch(function(e){b.disabled=false;m.style.color="var(--red)";m.textContent="Not sent: "+waMsg(e)+" Use the Open WhatsApp chat button instead."})}
  if(gid("svapi")){gid("svapi").onclick=go;if(auto&&g.auto)go()}}
function svcForm(j){
  var e=j||{cid:"",item:"",work:"",charge:"",adv:"",recv:ds(new Date()),note:"",status:"received"};
  var cs=S.custs.filter(function(c){return!c.walkin}).sort(function(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1});
  open('<h3 style="margin:0">'+(j?"Edit service job":"New service job")+'</h3>'+(j?'<div class="meta2">'+esc(j.no||"")+'</div>':'<div class="meta2">Job no '+svcNo()+'</div>')+
   '<label>Customer<select id="sv1"><option value="">Select customer</option><option value="__new">+ New customer</option>'+cs.map(function(c){return'<option value="'+c.id+'"'+(c.id===e.cid?" selected":"")+'>'+esc(c.name)+(c.phone?" · "+esc(c.phone):"")+'</option>'}).join("")+'</select></label>'+
   '<div id="svn" class="g2" style="display:none"><label>Customer name *<input id="sv2" autocomplete="off"></label><label>Mobile (WhatsApp) *<input id="sv3" type="tel" inputmode="tel" autocomplete="off"></label></div>'+
   '<label>Item given for service *<input id="sv4" placeholder="e.g. Mixer grinder, Fan, Inverter" value="'+esc(e.item)+'"></label>'+
   '<label>Problem / work to be done<input id="sv5" value="'+esc(e.work||"")+'"></label>'+
   '<div class="g2"><label>Service charge (₹)<input id="sv6" type="number" inputmode="decimal" min="0" step="any" value="'+(e.charge===""||e.charge==null?"":e.charge)+'"></label><label>Advance taken (₹)<input id="sv7" type="number" inputmode="decimal" min="0" step="any" value="'+(e.adv===""||e.adv==null?"":e.adv)+'"></label></div>'+
   '<div class="g2"><label>Received on<input id="sv8" type="date" value="'+esc(e.recv)+'"></label><label>Status<select id="sv10">'+SVST.map(function(s){return'<option value="'+s[0]+'"'+(s[0]===e.status?" selected":"")+'>'+s[1]+'</option>'}).join("")+'</select></label></div>'+
   '<label>Note<input id="sv9" value="'+esc(e.note||"")+'"></label><div class="ge" id="ge"></div><div class="acts"><button class="p" id="ok">Save</button><button id="cx">Cancel</button></div>');
  function tg(){gid("svn").style.display=gid("sv1").value==="__new"?"":"none"}
  gid("sv1").onchange=tg;
  if(!cs.length){gid("sv1").value="__new"}
  tg();
  function finish(cid){
    var o={cid:cid,item:fv("sv4"),work:fv("sv5"),charge:gv("sv6")===""?"":+gv("sv6"),adv:gv("sv7")===""?"":+gv("sv7"),recv:gv("sv8")||ds(new Date()),note:fv("sv9"),status:gv("sv10")};
    var was=j?j.status:"";
    if(j)Object.assign(j,o);else svcList().push(Object.assign({id:uid(),no:svcNo()},o));
    var jj=j||svcList()[svcList().length-1];
    if(o.status==="done"&&was!=="done")jj.doneAt=Date.now();
    save();render();dlg.close();toast("Service job saved.");
    if(o.status==="done"&&was!=="done")svcMsgDlg(jj,true)}
  gid("ok").onclick=function(){
    var er=gid("ge"),sel=gv("sv1");
    if(!sel){er.textContent="Select the customer, or choose + New customer.";return}
    if(!fv("sv4")){er.textContent="Enter the item given for service.";return}
    if(gv("sv6")!==""&&!(+gv("sv6")>=0)){er.textContent="Enter a valid service charge.";return}
    if(gv("sv7")!==""&&!(+gv("sv7")>=0)){er.textContent="Enter a valid advance amount.";return}
    if(sel!=="__new"){finish(sel);return}
    var n=fv("sv2"),ph=fv("sv3");
    if(!n){er.textContent="Enter the customer name.";return}
    if(ph.replace(/\D/g,"").length<10){er.textContent="Enter a mobile number with at least 10 digits.";return}
    var dup=findDupCust(n,ph,null);
    if(dup&&!(dup.how==="name"&&dupOK===dup.c.id)){
      er.textContent="This customer is already saved: "+dup.c.name+".";
      dupPopup(dup,function(){var s=gid("sv1");if(s){s.value=dup.c.id;tg();gid("ok").onclick()}},dup.how==="name"?function(){dupOK=dup.c.id;gid("ok").onclick()}:null);return}
    var c2={id:uid(),name:n,phone:ph,address:"",gstin:"",state:"",days:30,bl:false,blr:"",lastRem:""};
    S.custs.push(c2);dupOK="";finish(c2.id)}}
gid("tSvc").onclick=function(){tab="svc";render();window.scrollTo(0,0)};
gid("svhome").onclick=svcClick;

renderGate();load();fixMargin();window.LOCAL0=JSON.parse(JSON.stringify(S));render();
try{if(window.claude&&window.claude.use)window.claude.use("db").then(function(d){if(d)startDb(d);else noDb()}).catch(noDb);else noDb()}catch(e){noDb()}
setTimeout(noDb,15000);
</script>
